<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLO KARTS — 2-Player Splitscreen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script type="module" src="/src/splitscreen-main.js"></script>
  </head>
  <body style="margin:0;padding:0;overflow:hidden;background:#000;width:100vw;height:100vh;">
    <!-- Loading Screen -->
    <div id="loading-screen" style="
      position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:#0a0a0a;color:#fff;
      font-family:'Poppins',sans-serif;transition:opacity .5s;
    ">
      <h1 style="font-size:48px;margin:0;letter-spacing:4px;">GLO KARTS</h1>
      <p style="color:#888;margin:8px 0 24px;font-size:14px;letter-spacing:2px;">2-PLAYER SPLITSCREEN</p>
      <div style="width:200px;height:4px;background:#222;border-radius:2px;overflow:hidden;">
        <div id="load-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#00e5ff,#7c4dff);transition:width .3s;"></div>
      </div>
    </div>

    <!-- Shared canvas — Babylon.js renders both viewports here -->
    <canvas id="app" style="width:100vw;height:100vh;display:block;"></canvas>
  </body>
</html>
