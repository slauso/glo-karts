<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLO KARTS — Playtest</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f3f7ff;
      --muted: #a9b7c8;
      --glass: rgba(12, 17, 26, 0.82);
      --line: rgba(255,255,255,0.14);
      --neon-1: #ff4976;
      --neon-2: #ffc645;
      --neon-3: #4bd3ff;
      --neon-glow: rgba(255, 73, 118, 0.45);
      --radius: 12px;
      --shadow: 0 12px 34px rgba(0,0,0,0.42), 0 0 0 1px rgba(255,255,255,0.06) inset;
      --font-ui: 'Exo 2', system-ui, sans-serif;
      --font-display: 'Bungee', 'Impact', sans-serif;
    }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background:
        radial-gradient(100% 70% at 70% -20%, rgba(255, 73, 118, 0.22), transparent 60%),
        radial-gradient(80% 70% at 0% 100%, rgba(75, 211, 255, 0.16), transparent 56%),
        #090d14;
      color: var(--ink);
      font-family: var(--font-ui);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed; left: 16px; top: 16px;
      background: var(--glass); padding: 10px 14px; border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 13px;
      backdrop-filter: blur(8px) saturate(1.2);
      min-width: 220px;
    }
    .hud b { color: #ff6f95; font-weight: 800; }
    .hud > div { letter-spacing: 0.02em; }
    .controls {
      position: fixed; left: 16px; bottom: 16px;
      background: var(--glass); padding: 10px 14px; border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 12px; color: var(--muted);
      backdrop-filter: blur(8px) saturate(1.2);
    }
    .controls b { color: var(--ink); }
    .toolbar {
      position: fixed; right: 16px; top: 16px; display: flex; gap: 8px;
    }
    .toolbar button {
      background: linear-gradient(180deg, rgba(30,38,56,0.95), rgba(15,20,31,0.95));
      color: var(--ink); border: 1px solid var(--line);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
      font-weight: 700; letter-spacing: 0.03em;
      box-shadow: var(--shadow);
    }
    .toolbar button:hover { border-color: var(--neon-1); box-shadow: 0 0 14px var(--neon-glow), var(--shadow); }
    .room-banner {
      position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
      background: var(--glass); padding: 7px 14px; border-radius: 999px;
      font-size: 12px; color: var(--neon-3); border: 1px solid rgba(75,211,255,0.36);
      box-shadow: var(--shadow);
    }
    .pause-overlay {
      position: fixed; inset: 0;
      background: rgba(10,13,18,0.82);
      display: none; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 100;
    }
    .pause-overlay.open { display: flex; }
    .pause-card {
      background: #161b22; border: 1px solid #2a3340;
      padding: 32px 40px; border-radius: 8px;
      display: flex; flex-direction: column; gap: 14px; min-width: 260px;
      text-align: center;
    }
    .pause-card h2 {
      margin: 0 0 6px; font-size: 20px; letter-spacing: 0.08em;
      color: var(--neon-1); text-transform: uppercase;
      font-family: var(--font-display);
    }
    .pause-card button {
      background: #1f2630; color: #e6edf3; border: 1px solid #2a3340;
      padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    .pause-card button:hover { border-color: #ff3aa1; background: #2a3340; }
    .pause-card button.primary { background: #ff3aa1; border-color: #ff3aa1; color: #fff; font-weight: 600; }
    .pause-card button.primary:hover { filter: brightness(1.1); }
    /* ── Inventory HUD slot (Phase B) ─────────────────────────── */
    .invslot {
      position: fixed; right: 16px; bottom: 16px;
      width: 110px; height: 110px;
      background: linear-gradient(160deg, rgba(28,36,52,0.96), rgba(12,16,26,0.96));
      border: 2px solid #2a3340; border-radius: 16px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 10px 28px rgba(0,0,0,0.50);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: var(--font-ui);
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
      user-select: none; pointer-events: none;
      overflow: hidden;
    }
    .invslot::before {
      content: '';
      position: absolute;
      inset: -30% -20%;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.25), transparent 40%, transparent 100%);
      opacity: 0;
      transform: rotate(0deg);
    }
    .invslot.has { border-color: var(--neon-2); box-shadow: 0 0 0 1px rgba(255,198,69,0.35) inset, 0 10px 24px rgba(255,160,40,0.28); }
    .invslot.fire { transform: scale(1.09); border-color: var(--neon-1); box-shadow: 0 0 18px var(--neon-glow), 0 0 0 1px rgba(255,255,255,0.08) inset; }
    .invslot.spinning { border-color: var(--neon-3); }
    .invslot.spinning::before { opacity: 1; animation: inv-sweep 0.55s linear infinite; }
    .invslot .icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #888 60%, #444 100%);
      box-shadow: 0 0 14px currentColor;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 22px; letter-spacing: 0.04em;
    }
    .invslot.spinning .icon { animation: inv-spin 0.22s ease-in-out infinite; }
    .invslot .label {
      margin-top: 5px; font-size: 10px; color: #d4deeb; letter-spacing: 0.10em;
      text-transform: uppercase; max-width: 92px; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .invslot .count {
      position: absolute; top: 4px; right: 6px;
      font-size: 11px; color: #ffd24a; font-weight: 700;
    }
    .invslot .key {
      position: absolute; top: 4px; left: 6px;
      font-size: 9px; color: #93a4b7; letter-spacing: 0.1em;
    }
    .invslot.empty .icon { background: #1a1f27; box-shadow: none; color: #3a4250; }
    .invslot.empty .label { color: #4a5260; }
    @keyframes inv-spin {
      0% { transform: translateY(0px) scale(1) rotate(-2deg); }
      50% { transform: translateY(-1px) scale(1.04) rotate(2deg); }
      100% { transform: translateY(0px) scale(1) rotate(-2deg); }
    }
    @keyframes inv-sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── HP / coin HUD (Phase E3) ─────────────────────────── */
    .hpbar {
      position: fixed; right: 16px; bottom: 136px; width: 110px;
      background: var(--glass); padding: 7px 8px; border-radius: 9px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-family: var(--font-ui); font-size: 10px;
      color: #cdd6df; letter-spacing: 0.08em; text-transform: uppercase;
      pointer-events: none; user-select: none;
      backdrop-filter: blur(8px) saturate(1.2);
    }
    .hpbar .row { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
    .hpbar .meter {
      height: 6px; border-radius: 3px; background: #1a1f27; overflow: hidden;
      margin-top: 2px;
    }
    .hpbar .fill { height: 100%; background: linear-gradient(90deg, var(--neon-1), var(--neon-2)); transition: width 200ms ease; }
    .hpbar.low .fill  { background: linear-gradient(90deg, #ff3a3a, #ffaa33); }
    .hpbar.zero .fill { background: #ff3a3a; animation: hp-blink 220ms steps(2, end) infinite; }
    @keyframes hp-blink { to { opacity: 0.25; } }
    #combatTicker {
      margin-top: 6px;
      color: var(--neon-2);
      font-size: 12px;
      min-height: 16px;
      letter-spacing: 0.02em;
      text-shadow: 0 0 12px rgba(255,198,69,0.28);
    }

    @media (max-width: 820px) {
      .controls { max-width: calc(100vw - 32px); font-size: 11px; }
      .hud { max-width: calc(100vw - 140px); }
      .invslot { width: 98px; height: 98px; }
      .hpbar { width: 98px; bottom: 122px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hud">
    <div>Track: <b id="trackName">—</b></div>
    <div>Speed: <b id="speed">0</b> km/h</div>
    <div>Lap: <b id="lap">—</b></div>
    <div>Camera: <b id="cameraMode">Chase</b></div>
    <div id="combatTicker"></div>
  </div>
  <div class="controls">
    <div><b>W A S D</b> drive · <b>Space</b> brake · <b>Shift</b> drift hop · <b>Q</b> use item · <b>C</b> camera · <b>R</b> rewind 10s · <b>T</b> restart · <b>Esc</b> pause</div>
  </div>
  <div class="invslot empty" id="invSlot">
    <div class="key">Q</div>
    <div class="count" id="invCount"></div>
    <div class="icon" id="invIcon">·</div>
    <div class="label" id="invLabel">empty</div>
  </div>
  <div class="hpbar" id="hpBar">
    <div class="row"><span>HP</span><span id="hpVal">100</span></div>
    <div class="meter"><div class="fill" id="hpFill" style="width:100%"></div></div>
    <div class="row"><span>Coins</span><span id="coinVal">0</span></div>
  </div>
  <div class="toolbar">
    <button id="backBtn">← Back to Editor</button>
  </div>
  <div class="room-banner" id="roomBanner" style="display:none;"></div>
  <div class="pause-overlay" id="pauseOverlay">
    <div class="pause-card">
      <h2>Paused</h2>
      <button class="primary" id="resumeBtn">Resume</button>
      <button id="respawnBtn">Respawn Kart</button>
      <button id="backBtn2">← Back to Editor</button>
    </div>
  </div>
  <script type="module" src="/src/editor3/play-main.js"></script>
</body>
</html>
