<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twisted Kart FPS Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #060913;
        --panel: rgba(10, 16, 30, 0.64);
        --panel-border: rgba(115, 187, 255, 0.22);
        --accent: #7df7ff;
        --accent-2: #ff9959;
        --text: #e8f4ff;
        --muted: rgba(232, 244, 255, 0.6);
        --danger: #ff5d6c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        background:
          radial-gradient(circle at 20% 10%, rgba(76, 163, 255, 0.18), transparent 28%),
          radial-gradient(circle at 80% 80%, rgba(255, 153, 89, 0.14), transparent 24%),
          linear-gradient(180deg, #09101e 0%, #04070d 100%);
        color: var(--text);
        font-family: 'Rajdhani', sans-serif;
      }
      #fps-canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }

      #loading-screen {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        gap: 12px;
        background:
          radial-gradient(circle at 50% 20%, rgba(125, 247, 255, 0.12), transparent 25%),
          linear-gradient(180deg, rgba(7, 12, 23, 0.96), rgba(2, 5, 12, 0.98));
        backdrop-filter: blur(16px);
      }
      .loading-title {
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(2.8rem, 7vw, 5rem);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(125,247,255,0.4);
      }
      .loading-copy {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.34em;
        color: var(--muted);
      }
      .loading-bar {
        width: min(40vw, 320px);
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
      }
      .loading-bar::before {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        animation: loadSlide 1.1s ease-in-out infinite alternate;
      }
      @keyframes loadSlide {
        from { transform: translateX(-10%); }
        to { transform: translateX(140%); }
      }

      #crosshair {
        position: fixed;
        left: 50%; top: 50%;
        width: 28px; height: 28px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 20;
      }
      #crosshair::before,
      #crosshair::after,
      #crosshair span::before,
      #crosshair span::after {
        content: '';
        position: absolute;
        background: var(--text);
        box-shadow: 0 0 8px rgba(125,247,255,0.45);
      }
      #crosshair::before { left: 12px; top: 0; width: 4px; height: 8px; }
      #crosshair::after { left: 12px; bottom: 0; width: 4px; height: 8px; }
      #crosshair span::before { top: 12px; left: 0; width: 8px; height: 4px; }
      #crosshair span::after { top: 12px; right: 0; width: 8px; height: 4px; }

      .hud-panel {
        position: fixed;
        backdrop-filter: blur(18px) saturate(140%);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 18px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
        border-radius: 18px;
        z-index: 15;
      }

      #top-left {
        top: 18px; left: 18px;
        padding: 14px 18px;
        min-width: 220px;
      }
      .kicker {
        font-size: 0.72rem;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .metric {
        display: flex; align-items: baseline; gap: 10px;
        margin-top: 8px;
      }
      .metric .label {
        font-size: 0.78rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .metric .value {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.5rem;
      }

      #bottom-left {
        left: 18px; bottom: 18px;
        padding: 16px 18px;
        min-width: 300px;
      }
      #weapon-name {
        font-family: 'Orbitron', sans-serif;
        font-size: 1rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      #ammo-wrap {
        display: flex; align-items: end; gap: 8px; margin-top: 6px;
      }
      #ammo-current {
        font-family: 'Orbitron', sans-serif;
        font-size: 3.2rem;
        line-height: 1;
      }
      #ammo-max {
        font-size: 1.15rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      #reload-bar {
        display: none;
        margin-top: 12px;
        width: 100%; height: 8px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #reload-fill {
        width: 0%; height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }
      #slot-row {
        display: flex; gap: 10px; margin-top: 14px;
      }
      .slot {
        width: 56px; height: 42px;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--muted);
        font-weight: 700;
        background: rgba(255,255,255,0.03);
      }
      .slot.active {
        color: var(--text);
        border-color: rgba(125, 247, 255, 0.55);
        box-shadow: 0 0 18px rgba(125,247,255,0.2);
      }

      #top-right {
        right: 18px; top: 18px;
        padding: 14px 18px;
        min-width: 180px;
      }
      .health-bar {
        width: 100%; height: 10px;
        margin-top: 10px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #health-fill {
        width: 100%; height: 100%;
        background: linear-gradient(90deg, #7df7ff, #48db8a);
      }

      #bottom-right {
        right: 18px; bottom: 18px;
        padding: 14px 18px;
        min-width: 180px;
        text-align: right;
      }

      #hit-marker {
        position: fixed;
        left: 50%; top: 50%;
        width: 64px; height: 64px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s ease;
        z-index: 21;
      }
      #hit-marker.show { opacity: 1; }
      #hit-marker::before, #hit-marker::after {
        content: '';
        position: absolute;
        inset: 0;
        border: 3px solid transparent;
      }
      #hit-marker::before {
        border-left-color: white;
        border-right-color: white;
        transform: rotate(45deg);
      }
      #hit-marker::after {
        border-left-color: white;
        border-right-color: white;
        transform: rotate(-45deg);
      }

      #damage-flash {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 19;
        opacity: 0;
        background: radial-gradient(circle at center, rgba(255, 93, 108, 0.02), rgba(255, 93, 108, 0.14));
        transition: opacity 0.15s ease;
      }
      #damage-flash.show { opacity: 1; }

      #help {
        position: fixed;
        left: 50%; bottom: 18px;
        transform: translateX(-50%);
        z-index: 14;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(5, 9, 19, 0.6);
        border: 1px solid rgba(255,255,255,0.08);
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        #top-left, #top-right, #bottom-left, #bottom-right { transform: scale(0.9); transform-origin: top left; }
        #bottom-right { transform-origin: bottom right; }
        #bottom-left { transform-origin: bottom left; }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-title">Arena FPS</div>
      <div class="loading-copy" id="loading-copy">Streaming Havok + Babylon assets</div>
      <div class="loading-bar"></div>
    </div>

    <canvas id="fps-canvas"></canvas>

    <div id="crosshair"><span></span></div>
    <div id="hit-marker"></div>
    <div id="damage-flash"></div>

    <div id="top-left" class="hud-panel">
      <div class="kicker">Performance</div>
      <div class="metric"><span class="label">FPS</span><span class="value" id="fps-value">60</span></div>
      <div class="metric"><span class="label">Hits</span><span class="value" id="hit-value">0</span></div>
    </div>

    <div id="top-right" class="hud-panel">
      <div class="kicker">Health</div>
      <div class="metric"><span class="label">Hull</span><span class="value" id="health-value">100</span></div>
      <div class="health-bar"><div id="health-fill"></div></div>
    </div>

    <div id="bottom-left" class="hud-panel">
      <div class="kicker">Loadout</div>
      <div id="weapon-name">CANNON</div>
      <div id="ammo-wrap">
        <div id="ammo-current">0</div>
        <div id="ammo-max">/ 0</div>
      </div>
      <div id="reload-bar"><div id="reload-fill"></div></div>
      <div id="slot-row">
        <div id="slot-0" class="slot active">1</div>
        <div id="slot-1" class="slot">2</div>
        <div id="slot-2" class="slot">3</div>
      </div>
    </div>

    <div id="bottom-right" class="hud-panel">
      <div class="kicker">Score</div>
      <div class="metric"><span class="label">Total</span><span class="value" id="score-value">0</span></div>
    </div>

    <div id="help">Click to lock pointer • WASD Move • Space Jump • 1/2/3 Swap • R Reload • LMB Fire</div>

    <script type="module" src="/src/fps-main.js"></script>
  </body>
</html>
