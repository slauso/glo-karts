<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLO KARTS — Arena Builder v2</title>
    <link rel="stylesheet" href="/src/builder-v2/builder-v2.css" />
  </head>
  <body>
    <div id="builder-root" class="bv2">

      <!-- ── Top Toolbar ──────────────────────────────────────── -->
      <header id="bv2-toolbar" class="bv2-toolbar">
        <button id="bv2-back" class="bv2-btn" title="Back to menu">← Menu</button>
        <div class="bv2-sep"></div>
        <input id="bv2-name" class="bv2-name" type="text" maxlength="48" placeholder="Arena Name" />
        <div class="bv2-sep"></div>
        <div class="bv2-toolset" role="toolbar" aria-label="Editor tools">
          <button id="bv2-tool-select" class="bv2-btn bv2-tool active" type="button" title="Select (1)">↖ Select</button>
          <button id="bv2-tool-road"   class="bv2-btn bv2-tool" type="button" title="Road (2)">🛣 Road</button>
          <button id="bv2-tool-place"  class="bv2-btn bv2-tool" type="button" title="Place Object (3)">📦 Place</button>
          <button id="bv2-tool-erase"  class="bv2-btn bv2-tool" type="button" title="Erase (4)">⌫ Erase</button>
        </div>
        <div class="bv2-sep"></div>
        <button id="bv2-undo"   class="bv2-btn bv2-btn--icon" title="Undo (Ctrl+Z)">↩</button>
        <button id="bv2-redo"   class="bv2-btn bv2-btn--icon" title="Redo (Ctrl+Y)">↪</button>
        <button id="bv2-delete" class="bv2-btn bv2-btn--icon bv2-btn--danger" title="Delete (Del)">🗑</button>
        <div class="bv2-sep"></div>
        <button id="bv2-grid-snap" class="bv2-btn bv2-btn--toggle" title="Toggle Grid Snap (G)">⊞ Snap</button>
        <button id="bv2-cam-toggle" class="bv2-btn bv2-btn--toggle" title="Ortho / Perspective (Numpad 5)">🎥 Cam</button>
        <div class="bv2-spacer"></div>
        <button id="bv2-save"  class="bv2-btn bv2-btn--accent" title="Save (Ctrl+S)">Save</button>
        <button id="bv2-load"  class="bv2-btn">Load</button>
        <button id="bv2-share" class="bv2-btn">Share</button>
        <div class="bv2-sep"></div>
        <button id="bv2-play" class="bv2-btn bv2-btn--cta">▶ Playtest</button>
      </header>

      <!-- ── Left Sidebar: Toolbox Panels ─────────────────────── -->
      <nav id="bv2-sidebar" class="bv2-sidebar">
        <div class="bv2-tabs" role="tablist">
          <button class="bv2-tab active" data-panel="objects"  title="Objects (1)">📦</button>
          <button class="bv2-tab"        data-panel="road"     title="Road (2)">🛣</button>
          <button class="bv2-tab"        data-panel="extras"   title="Extras (3)">⚙</button>
          <button class="bv2-tab"        data-panel="terrain"  title="Terrain (4)">🏔</button>
        </div>
        <div id="bv2-panel-objects"  class="bv2-panel active" role="tabpanel"></div>
        <div id="bv2-panel-road"     class="bv2-panel" role="tabpanel" hidden></div>
        <div id="bv2-panel-extras"   class="bv2-panel" role="tabpanel" hidden></div>
        <div id="bv2-panel-terrain"  class="bv2-panel" role="tabpanel" hidden></div>
      </nav>

      <!-- ── 3D Viewport ─────────────────────────────────────── -->
      <main id="bv2-stage" class="bv2-stage">
        <canvas id="bv2-viewport"></canvas>
        <div id="bv2-hint" class="bv2-hint">Select a tool to begin building your arena.</div>
      </main>

      <!-- ── Right Panel: Inspector ───────────────────────────── -->
      <aside id="bv2-inspector" class="bv2-inspector">
        <div class="bv2-panel-head">
          <span>Inspector</span>
          <span id="bv2-sel-badge" class="bv2-badge">None</span>
        </div>
        <div id="bv2-inspector-content" class="bv2-inspector-content">
          <p class="bv2-empty">Select an object to inspect its properties.</p>
        </div>
      </aside>

    </div>

    <div id="bv2-toast-wrap" class="bv2-toast-wrap"></div>

    <script type="module" src="/src/builder-v2/builder-app.js"></script>
  </body>
</html>
