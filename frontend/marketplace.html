<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLO KARTS — Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script type="module" src="/src/marketplace-main.js"></script>
  </head>
  <body style="margin:0;padding:0;overflow-x:hidden;background:#0a0a0a;color:#fff;font-family:'Poppins',sans-serif;">
    <!-- Header -->
    <header id="mp-header" style="
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 32px;background:rgba(0,0,0,.6);border-bottom:1px solid #222;
    ">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="index.html" style="color:#999;text-decoration:none;font-size:14px;">&larr; Back</a>
        <h1 style="margin:0;font-size:24px;letter-spacing:2px;">MARKETPLACE</h1>
      </div>
      <div id="wallet-section" style="display:flex;align-items:center;gap:16px;">
        <span id="balance-display" style="font-size:14px;color:#888;">—</span>
        <button id="wallet-btn" style="
          padding:8px 20px;border:none;border-radius:6px;cursor:pointer;
          background:linear-gradient(135deg,#7c4dff,#00e5ff);color:#fff;
          font-family:inherit;font-size:14px;font-weight:600;
        ">Connect Wallet</button>
      </div>
    </header>

    <!-- Category tabs -->
    <nav id="category-tabs" style="
      display:flex;gap:8px;padding:16px 32px;border-bottom:1px solid #1a1a1a;
    "></nav>

    <!-- Add-on grid -->
    <main id="addon-grid" style="
      display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:20px;padding:24px 32px;
    "></main>

    <!-- Toast container -->
    <div id="toast-container" style="
      position:fixed;bottom:24px;right:24px;z-index:9000;
      display:flex;flex-direction:column;gap:8px;
    "></div>
  </body>
</html>
