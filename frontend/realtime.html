<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLO KARTS - Online</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/1ab8f48e0a.js" crossorigin="anonymous"></script>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{background:#05050a;color:#fff;font-family:"Exo 2","Poppins",sans-serif;overflow:hidden}
      #loading-screen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .5s ease-in-out}
      .loading-title{font-family:"Bungee","Impact",sans-serif;font-weight:400;font-size:clamp(3.5rem,8vw,6rem);text-transform:uppercase;color:#fff;letter-spacing:6px;margin-bottom:8px;text-shadow:0 0 60px rgba(255,0,128,.5)}
      .loading-subtitle{font-weight:700;font-size:1.4rem;text-transform:uppercase;letter-spacing:10px;color:#ff0080;margin-bottom:48px}
      .loader{display:flex;gap:8px;margin-bottom:16px}
      .bar{width:10px;height:48px;background:#ff0080;border-radius:4px;animation:barLoad 1.4s infinite ease-in-out;transform:scaleY(.1)}
      .bar:nth-child(1){animation-delay:0s}.bar:nth-child(2){animation-delay:.1s}.bar:nth-child(3){animation-delay:.2s}.bar:nth-child(4){animation-delay:.3s}.bar:nth-child(5){animation-delay:.4s}
      @keyframes barLoad{0%,100%{transform:scaleY(.1)}50%{transform:scaleY(1)}}
      .loading-text{color:rgba(255,255,255,.65);font-weight:600;font-size:1rem;letter-spacing:3px;text-transform:uppercase}
      #realtime-canvas{width:100vw;height:100vh;display:block;touch-action:none}
      .exit-game-btn{position:fixed;top:20px;right:20px;z-index:100;width:44px;height:44px;border-radius:50%;background:rgba(12,12,18,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;transition:all .2s}
      .exit-game-btn:hover{background:#ff0080;color:#fff;border-color:#b30059}
      #weapon-hud{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
      #effect-overlay{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}

      /* ── Prematch Lobby ────────────────────────────────── */
      #prematch-lobby{position:fixed;inset:0;z-index:9997;display:none;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(ellipse 120% 80% at 50% -20%,rgba(255,0,128,.12) 0%,#05050a 60%),radial-gradient(ellipse 80% 60% at 80% 90%,rgba(60,0,200,.08) 0%,#05050a 55%),#05050a;
        font-family:"Exo 2","Poppins",sans-serif;color:#fff;transition:opacity .6s ease-in-out;opacity:0;overflow:hidden}
      #prematch-lobby.visible{display:flex;opacity:1}
      #prematch-lobby.fade-out{opacity:0}

      .pm-title{font-family:"Bungee","Impact",sans-serif;font-weight:400;font-size:clamp(2rem,5vw,3.2rem);text-transform:uppercase;letter-spacing:6px;color:#fff;text-shadow:0 0 50px rgba(255,0,128,.5);margin-bottom:4px}
      .pm-subtitle{font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:8px;color:#ff0080;margin-bottom:24px}

      .pm-body{display:flex;gap:28px;width:90%;max-width:1100px;align-items:flex-start;justify-content:center;flex-wrap:wrap}

      /* Map preview panel */
      .pm-map-panel{flex:0 0 280px;border-radius:18px;overflow:hidden;
        background:rgba(255,255,255,.055);backdrop-filter:blur(12px) saturate(140%);
        border:1px solid rgba(255,255,255,.13);
        box-shadow:0 2px 0 rgba(255,255,255,.08) inset,0 -1px 0 rgba(0,0,0,.35) inset,0 20px 60px rgba(0,0,0,.55)}
      .pm-map-canvas-wrap{width:100%;height:180px;position:relative;background:linear-gradient(135deg,rgba(255,0,128,.12),rgba(60,0,200,.15),rgba(0,30,60,.4));display:flex;align-items:center;justify-content:center}
      .pm-map-canvas-wrap::after{content:'\1F3C1';font-size:3rem;opacity:.35}
      .pm-map-canvas-wrap canvas{width:100%;height:100%;display:block}
      .pm-map-info{padding:14px 18px}
      .pm-map-name{font-family:"Bungee","Impact",sans-serif;font-size:1.1rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
      .pm-map-mode{font-size:.8rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#ff0080}

      /* Game settings bar */
      .pm-settings{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
      .pm-setting-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:9999px;font-size:.72rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
        background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.7)}

      /* Players grid */
      .pm-players-panel{flex:1;min-width:300px}
      .pm-players-title{font-size:.75rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:12px}
      .pm-players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}

      .pm-player-card{border-radius:14px;padding:10px;text-align:center;
        background:rgba(255,255,255,.055);backdrop-filter:blur(8px) saturate(120%);
        border:1px solid rgba(255,255,255,.13);
        box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.3);
        transition:border-color .3s,box-shadow .3s}
      .pm-player-card.is-local{border-color:rgba(255,0,128,.4);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 8px 24px rgba(255,0,128,.15)}
      .pm-glo-swatch{width:100%;height:6px;border-radius:3px;margin-bottom:4px}
      .pm-kart-canvas{width:140px;height:100px;margin:0 auto 4px;display:block;border-radius:8px}
      .pm-player-name{font-weight:700;font-size:.82rem;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

      /* Countdown */
      .pm-countdown-wrap{margin-top:28px;text-align:center}
      .pm-countdown-label{font-size:.7rem;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px}
      .pm-countdown-num{font-family:"Bungee","Impact",sans-serif;font-size:clamp(3rem,8vw,5rem);color:#fff;
        text-shadow:0 0 40px rgba(255,0,128,.7),0 4px 20px rgba(0,0,0,.5);transition:transform .25s ease-out,opacity .25s ease-out}
      .pm-countdown-num.pulse{animation:pm-pulse .4s ease-out}
      @keyframes pm-pulse{0%{transform:scale(1.4);opacity:1}100%{transform:scale(1);opacity:1}}
      .pm-waiting{font-size:1rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5)}
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <h1 class="loading-title">GLO KARTS</h1>
      <p class="loading-subtitle">ONLINE</p>
      <div class="loader">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="loading-text">Connecting...</div>
    </div>

    <!-- Prematch Lobby Screen -->
    <div id="prematch-lobby">
      <h1 class="pm-title">GLO KARTS</h1>
      <p class="pm-subtitle" id="pm-mode-label">RACE</p>

      <div class="pm-body">
        <!-- Map Preview -->
        <div class="pm-map-panel">
          <div class="pm-map-canvas-wrap">
            <canvas id="pm-map-canvas"></canvas>
          </div>
          <div class="pm-map-info">
            <div class="pm-map-name" id="pm-map-name">Test Box</div>
            <div class="pm-map-mode" id="pm-map-mode-tag">RACE</div>
            <div class="pm-settings" id="pm-settings"></div>
          </div>
        </div>

        <!-- Player Grid -->
        <div class="pm-players-panel">
          <div class="pm-players-title">PLAYERS</div>
          <div class="pm-players-grid" id="pm-players-grid"></div>
        </div>
      </div>

      <!-- Countdown -->
      <div class="pm-countdown-wrap">
        <div class="pm-countdown-label">MATCH STARTS IN</div>
        <div class="pm-countdown-num" id="pm-countdown">—</div>
      </div>
    </div>

    <!-- Babylon.js canvas -->
    <canvas id="realtime-canvas"></canvas>

    <!-- Weapon HUD -->
    <div id="weapon-hud" aria-hidden="true"></div>

    <!-- Status-effect overlay -->
    <div id="effect-overlay"></div>

    <!-- Exit to lobby -->
    <a href="index.html" class="exit-game-btn" aria-label="Return to lobby">
      <i class="fas fa-door-open"></i>
    </a>

    <!-- Entry script — bootstraps Colyseus + Babylon.js client -->
    <script type="module">
      import { ColyseusBabylonClient } from '/src/modules/realtime/colyseus-babylon-client.js';
      import { getColyseusEndpoint } from '/src/modules/realtime/feature-flag.js';

      const params = new URLSearchParams(window.location.search);
      const isDevBattle = !!import.meta.env.DEV && params.get('devBattle') === '1';
      const scenarioDelayMs = Number(params.get('scenarioDelayMs') || 900);
      const scenarioCount = Number(params.get('scenarioCount') || 10);
      const scenarioTrackId = params.get('trackId') || 'test_box';
      const scenarioWeapon = params.get('scenarioWeapon') || 'super_nova';

      const ensureDevPlayerId = () => {
        const existing = sessionStorage.getItem('myPlayerId') || localStorage.getItem('myPlayerId');
        if (existing) return existing;
        const next = `dev-${Math.random().toString(36).slice(2, 10)}`;
        sessionStorage.setItem('myPlayerId', next);
        localStorage.setItem('myPlayerId', next);
        return next;
      };

      const baseConfig = JSON.parse(sessionStorage.getItem('gameConfig') || '{}');
      const myId = isDevBattle ? ensureDevPlayerId() : (sessionStorage.getItem('myPlayerId') || localStorage.getItem('myPlayerId'));
      const config = isDevBattle
        ? {
            gameMode: 'battle',
            battleType: 'deathmatch',
            trackId: scenarioTrackId,
            arenaId: scenarioTrackId,
            maxPlayers: 2,
            scoreLimit: 5,
            players: [{
              id: myId,
              name: params.get('playerName') || 'DevBattle',
              playerColor: params.get('playerColor') || 'red',
            }],
            ...baseConfig,
            gameMode: 'battle',
            battleType: params.get('battleType') || baseConfig.battleType || 'deathmatch',
            trackId: scenarioTrackId,
            arenaId: scenarioTrackId,
          }
        : baseConfig;
      const glo    = {
        gloEffect: sessionStorage.getItem('gloEffect') || 'falling-petals',
        gloColor:  sessionStorage.getItem('gloColor')  || '#ff0080',
        gloColor2: sessionStorage.getItem('gloColor2') || '#00e5ff',
      };

      const isBattle = config.gameMode === 'battle';
      const roomName = isBattle ? 'battle_room' : 'race_room';
      const canvas   = document.getElementById('realtime-canvas');

      // Update splash subtitle
      const sub = document.querySelector('.loading-subtitle');
      if (sub) sub.textContent = isBattle ? 'BATTLE' : 'RACE';

      const client = new ColyseusBabylonClient({
        endpoint:   getColyseusEndpoint(),
        roomName,
        playerName: config.players?.find(p => p.id === myId)?.name || 'Player',
        maxPlayers: config.maxPlayers || 12,
        gameType:   config.battleType || 'deathmatch',
      });

      (async () => {
        const lt = document.querySelector('.loading-text');
        const maxRetries = 2;
        let lastError = null;

        try {
          console.log('[Realtime] Step 1: gameConfig =', JSON.stringify(config));
          console.log('[Realtime] Step 1b: endpoint =', client.endpoint, 'roomName =', roomName);

          console.log('[Realtime] Step 2: initBabylon...');
          await client.initBabylon(canvas);
          console.log('[Realtime] Step 2 OK: Babylon initialized');

          const connectOpts = {
            partyCode:   config.lobbyCode || config.partyCode || '',
            trackId:     config.trackId   || 'test_box',
            arenaId:     config.arenaId   || 'test_box',
            gameMode:    config.gameMode  || 'race',
            gameType:    config.battleType || 'deathmatch',
            maxPlayers:  config.maxPlayers || 12,
            scoreLimit:  config.scoreLimit || 5,
            playerName:  config.players?.find(p => p.id === myId)?.name || 'Player',
            kartId:      config.selectedKart || sessionStorage.getItem('selectedKart') || 'tux',
            playerColor: config.players?.find(p => p.id === myId)?.playerColor || 'red',
            ...glo,
          };
          console.log('[Realtime] Step 3: connect opts =', JSON.stringify(connectOpts));

          // Retry connection up to maxRetries times
          for (let attempt = 0; attempt <= maxRetries; attempt++) {
            try {
              if (attempt > 0) {
                console.log(`[Realtime] Retry ${attempt}/${maxRetries}...`);
                if (lt) lt.textContent = `Retrying connection (${attempt}/${maxRetries})...`;
                await new Promise(r => setTimeout(r, 1500 * attempt));
              }
              await client.connect(connectOpts);
              console.log('[Realtime] Step 3 OK: Connected to room');
              lastError = null;
              break;
            } catch (err) {
              lastError = err;
              console.warn(`[Realtime] Attempt ${attempt + 1} failed:`, err?.message || err);
              if (attempt === maxRetries) throw err;
            }
          }

          // Auto-trigger match start after prematch lobby is shown
          setTimeout(() => { client.triggerStart(); }, 3000);
          // Expose for automated Playwright tests
          window.__gloClient = client;
          if (isDevBattle && window.__gloDebug) {
            window.__gloDebug.devBattleMode = true;
            window.__gloDebug.devBattleConfig = {
              trackId: scenarioTrackId,
              scenarioCount,
              scenarioWeapon,
            };
          }
        } catch (err) {
          const msg = err?.message || String(err);
          console.error('[Realtime] Connection failed:', msg);
          console.error('[Realtime] Full error:', err);
          if (lt) lt.textContent = `Connection failed: ${msg.slice(0, 120)}`;
          setTimeout(() => { window.location.href = 'index.html'; }, 4000);
        }
      })();

      if (isDevBattle) {
        let debugScenarioScheduled = false;
        const runDebugScenarioWhenReady = async () => {
          if (debugScenarioScheduled) return;
          debugScenarioScheduled = true;
          const maxAttempts = 80;
          for (let attempt = 0; attempt < maxAttempts; attempt++) {
            if (window.__gloDebug?.matchLive && typeof window.__gloDebug?.runBattleDebugScenario === 'function') {
              window.__gloDebug.runBattleDebugScenario({
                count: scenarioCount,
                subType: scenarioWeapon,
                durationMs: Number(params.get('durationMs') || 1200),
                radius: Number(params.get('radius') || 14),
              });
              return;
            }
            await new Promise((resolve) => setTimeout(resolve, scenarioDelayMs));
          }
          console.warn('[Realtime] Dev battle scenario hook never became ready');
        };
        runDebugScenarioWhenReady();
        window.addEventListener('load', () => { runDebugScenarioWhenReady(); }, { once: true });
      }
    </script>

    <!-- Vercel analytics: only on deployed domain -->
    <script type="module">
      if (/\.vercel\.app$/i.test(location.hostname)) {
        import('https://esm.sh/@vercel/analytics').then(({ inject }) => inject()).catch(() => {});
      }
    </script>
  </body>
</html>
