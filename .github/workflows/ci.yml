name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  realtime-validate:
    name: Realtime Install & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: realtime/package-lock.json

      - run: npm ci

      # Start server, wait for health endpoint, then shut down
      - name: Validate server starts and responds
        run: |
          node src/index.js &
          SERVER_PID=$!
          sleep 5
          curl --fail --retry 3 --retry-delay 2 http://localhost:2567/health
          kill $SERVER_PID

  playwright-smoke:
    name: Playwright Smoke Tests
    needs: [frontend-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Run tests that don't require Colyseus (skip 07, 08 which need server)
      - name: Run Playwright smoke suite
        run: |
          npx playwright test \
            tests/01-spawn-sequence.spec.js \
            tests/02-map-viability.spec.js \
            tests/04-kart-scaling.spec.js \
            tests/05-prematch-lobby.spec.js \
            tests/06-garage-selection.spec.js \
            tests/09-content-tracks.spec.js \
            tests/10-race-flows.spec.js \
            tests/11-battle-flows.spec.js \
            tests/12-solo-mode.spec.js \
            --reporter=line

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/test-results/
            frontend/tests/reports/
          retention-days: 14
